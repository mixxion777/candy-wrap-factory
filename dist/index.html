  <style>

    :root{--ink:#402b48;--pink:#ff648e;--cream:#fff5dc;--mint:#72dfbd;--yellow:#ffd755}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#ffdbe5,#b591db 55%,#574f92);color:var(--ink);font-family:Jua,sans-serif;overflow-x:hidden}.game{width:min(720px,100%);min-height:100vh;margin:auto;padding:22px 18px 30px;background:linear-gradient(120deg,#fff8e8e8,#e9d5ffe8);box-shadow:0 0 50px #31204a}
    h1{font:36px 'Black Han Sans',sans-serif;text-align:center;margin:4px 0;color:#fc4f7a;text-shadow:3px 3px #fff}.sub{text-align:center;margin:0 0 18px;color:#735576}.hud{display:flex;justify-content:space-between;gap:8px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:5px 5px 0 #f7b3c7}.hud b{color:#ef3c6e}.stage{position:relative;height:410px;margin-top:18px;border:5px solid var(--ink);border-radius:26px;overflow:hidden;background:linear-gradient(#bcecff 0 55%,#f7c4d2 55%);box-shadow:7px 7px 0 #765578}.belt{position:absolute;left:0;right:0;bottom:45px;height:107px;background:repeating-linear-gradient(90deg,#50475c 0 42px,#6e6575 42px 80px);border-block:6px solid #332b3d}.belt:after{content:'';position:absolute;top:38px;left:0;right:0;border-top:6px dashed #cec5d1}.machine{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:230px;height:166px;background:#ff7598;border:6px solid var(--ink);border-radius:26px 26px 15px 15px;box-shadow:inset 0 -16px #e4527a,7px 7px 0 #725477}.machine:before{content:'포장 프레스';position:absolute;width:100%;top:16px;text-align:center;font:22px 'Black Han Sans';color:white;text-shadow:2px 2px #8f2c4b}.stamp{position:absolute;left:59px;bottom:12px;width:101px;height:60px;border:6px solid var(--ink);border-radius:12px;background:var(--yellow);transition:.07s}.stamp.hit{transform:translateY(25px);background:#fff2a7}.candy{position:absolute;left:50%;bottom:83px;transform:translateX(-50%);width:135px;height:63px;border:4px solid var(--ink);border-radius:14px;background:linear-gradient(135deg,#fff,#ffd2e0 45%,#fff);box-shadow:5px 5px 0 #9f779b;opacity:.25;transition:.12s}.candy.active{opacity:1}.candy:before,.candy:after{content:'';position:absolute;top:11px;width:27px;height:32px;background:#ffe5ee;border:4px solid var(--ink);z-index:-1}.candy:before{left:-23px;clip-path:polygon(100% 0,0 18%,0 82%,100% 100%)}.candy:after{right:-23px;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%)}.jelly{position:absolute;left:44px;top:10px;width:39px;height:39px;border:3px solid var(--ink);border-radius:50%;background:#ff5d71}.prompt{position:absolute;left:50%;top:220px;transform:translateX(-50%);width:max-content;text-align:center;font:27px 'Black Han Sans';color:white;text-shadow:3px 3px #5b3c69}.judge{position:absolute;left:50%;top:158px;transform:translateX(-50%) scale(.5);font:40px 'Black Han Sans';opacity:0;transition:.3s;text-shadow:3px 3px white}.judge.show{opacity:1;transform:translateX(-50%) scale(1)}.perfect{color:#ff3570}.good{color:#26a982}.miss{color:#68707e}.progress{height:16px;border:3px solid var(--ink);margin:14px 3px;border-radius:10px;background:#fff;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6289,#ffd84e);transition:width .2s}.controls{text-align:center}.controls button{font:25px Jua;border:4px solid var(--ink);border-radius:17px;padding:13px 30px;background:#ffdc59;color:var(--ink);box-shadow:5px 5px 0 #725477;cursor:pointer}.controls button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #725477}.hint{margin:13px 0 0;text-align:center;color:#704e71}.result{display:none;text-align:center;padding:20px 5px}.result h2{font:34px 'Black Han Sans';margin:7px}.gift{font-size:88px;filter:drop-shadow(5px 6px #8e6887)}.price{font:32px 'Black Han Sans';color:#f13c6d}.comment{font-size:22px;background:white;border:4px solid var(--ink);border-radius:17px;padding:13px;margin:14px 0}.small{font-size:16px;color:#704e71}@media(max-width:430px){h1{font-size:30px}.stage{height:380px}.hud{font-size:14px}.prompt{font-size:22px}}
    .belt{z-index:1;background-size:80px 100%;animation:belt 1s linear infinite}@keyframes belt{to{background-position:-80px 0}}.machine{z-index:3}.candy{z-index:2;left:-160px;transform:none;opacity:0;transition:opacity .08s}.prompt{z-index:4}.judge{z-index:5}.pack-box{margin:12px auto;width:min(370px,100%);min-height:118px;padding:15px 18px;background:#fff0bb;border:5px solid var(--ink);border-radius:18px;box-shadow:inset 0 0 0 8px #ff879f;display:flex;gap:5px;align-content:flex-start;flex-wrap:wrap}.mini{width:27px;height:16px;border:2px solid var(--ink);border-radius:4px;background:#fff;position:relative}.mini:after{content:'';width:7px;height:7px;border-radius:50%;background:#ff6078;position:absolute;top:2px;left:8px}.mini.bad{background:#a9a1a9;transform:rotate(10deg)}

<body><main class="game"><section id="play">
  <h1>사탕 포장 공장</h1><p class="sub">박자에 맞춰 프레스를 찍어, 선물용 사탕을 만들어!</p>
  <div class="hud"><span>포장 <b id="count">0</b> / 28</span><span>콤보 <b id="combo">0</b></span><span>점수 <b id="score">0</b></span></div>
  <div class="progress"><i id="bar"></i></div>

  <div class="controls"><button id="start">▶ 음악과 함께 시작</button></div><p class="hint">스페이스바 · 화면 아무 데나 터치로 <b>쾅!</b></p>
</section><section class="result" id="result"><div class="gift">🎁</div><h2 id="grade">완벽한 사탕</h2><div class="price" id="price">₩ 12,000</div><p class="comment" id="comment"></p><p class="small" id="breakdown"></p><div class="controls"><button onclick="location.reload()">다시 찍어내기</button></div></section>
<audio id="music" preload="auto" src="chip_jpop_song.wav"></audio></main>
<script>
const music=document.querySelector('#music'), start=document.querySelector('#start'), stage=document.querySelector('#stage'), stamp=document.querySelector('#stamp'), candy=document.querySelector('#candy'), prompt=document.querySelector('#prompt'),judge=document.querySelector('#judge');
const count=document.querySelector('#count'),combo=document.querySelector('#combo'),scoreEl=document.querySelector('#score'),bar=document.querySelector('#bar');
// 41초 곡의 강한 비트에 맞춘 28개의 프레스 차트
const chart=[1.58,3.16,4.74,6.32,7.90,9.48,11.06,12.64,14.22,15.80,17.38,18.96,20.54,21.72,23.30,24.88,26.46,27.25,28.04,28.83,29.62,30.41,31.20,32.78,34.36,35.94,37.52,39.10];
let running=false,index=0,score=0,comboN=0,perfect=0,good=0,miss=0,timer,wrapped=[];
function update(){count.textContent=index;combo.textContent=comboN;scoreEl.textContent=score;bar.style.width=(index/chart.length*100)+'%'}
function show(text,kind){judge.textContent=text;judge.className='judge '+kind+' show';setTimeout(()=>judge.classList.remove('show'),280)}
function tick(){if(!running)return;let now=music.currentTime,target=chart[index];if(target){let lead=target-now,progress=Math.max(0,Math.min(1,(1.15-lead)/1.15));candy.style.left=(-145+progress*(stage.clientWidth*.5-67))+'px';candy.classList.toggle('active',lead<1.15&&lead>-.35);prompt.textContent=lead<.38&&lead>-.28?'지금 프레스!':'사탕이 레일을 타고 옵니다…'}while(index<chart.length&&now-chart[index]>.22){miss++;wrapped.push('bad');comboN=0;show('MISS','miss');index++;update()}if(index>=chart.length&&now>chart[chart.length-1]+.7)finish();}
function hit(){if(!running||index>=chart.length)return;let d=Math.abs(music.currentTime-chart[index]);if(d>.28)return;stamp.classList.add('hit');setTimeout(()=>stamp.classList.remove('hit'),70);if(d<=.075){perfect++;wrapped.push('good');score+=1000;comboN++;show('PERFECT!','perfect')}else{good++;wrapped.push('good');score+=550;comboN++;show('GOOD','good')}index++;update()}
function finish(){running=false;clearInterval(timer);music.pause();document.querySelector('#play').style.display='none';document.querySelector('#result').style.display='block';let rate=(perfect+good*.65)/chart.length;let g,p,c;if(rate>=.88){g='완벽한 사탕';p='₩ 12,000';c='백화점 지하 1층에 납품 가능합니다.'}else if(rate>=.62){g='그냥그런 사탕';p='₩ 7,500';c='마음은 담겼습니다. 포장도 대체로요.'}else{g='허접한 사탕';p='₩ 500';c='사탕을 포장한 게 아니라 포장지를 공격했습니다.'}document.querySelector('#grade').textContent=g;document.querySelector('#price').textContent=p;document.querySelector('#comment').textContent='“'+c+'”';document.querySelector('#breakdown').textContent=`PERFECT ${perfect} · GOOD ${good} · MISS ${miss} · 총점 ${score}`}
start.onclick=async()=>{try{await music.play()}catch(e){prompt.textContent='음악 재생을 허용해줘!';return}running=true;start.textContent='음악 재생 중';start.disabled=true;prompt.textContent='첫 사탕이 옵니다…';timer=setInterval(tick,16)};
stage.addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();hit()}});music.addEventListener('ended',()=>{if(running)finish()});
// 결과 선물세트 안에 방금 만든 사탕을 실제로 쌓는다.
const originalFinish=finish;finish=function(){let result=document.querySelector('#result');let box=document.createElement('div');box.className='pack-box';box.setAttribute('aria-label','완성된 사탕 선물세트');box.innerHTML=wrapped.map(x=>`<i class="mini ${x==='bad'?'bad':''}"></i>`).join('');let price=document.querySelector('#price');price.before(box);originalFinish()};
// 공정선: 오른쪽 원료가 프레스를 지나 왼쪽 완제품 레일로 빠져나간다.
document.head.insertAdjacentHTML('beforeend',`<style>
.candy{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b6 0 13%,#ffc951 15% 63%,#ee8d3f 65%);box-shadow:4px 5px 0 #806172}.candy:before,.candy:after{display:none}.jelly{left:14px;top:14px;width:20px;height:20px;background:#ff6380;border-width:2px}.packed-run{position:absolute;z-index:2;left:calc(50% - 66px);bottom:83px;width:132px;height:58px;border:4px solid var(--ink);border-radius:13px;background:linear-gradient(135deg,#fff,#d7f7ff 45%,#fff);box-shadow:4px 4px 0 #92728e;animation:outLeft 1.05s linear forwards}.packed-run:before,.packed-run:after{content:'';position:absolute;top:10px;width:25px;height:31px;background:#dff8ff;border:4px solid var(--ink);z-index:-1}.packed-run:before{left:-22px;clip-path:polygon(100% 0,0 18%,0 82%,100% 100%)}.packed-run:after{right:-22px;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%)}.packed-run i{display:block;width:33px;height:33px;border-radius:50%;border:3px solid var(--ink);background:#ff6684;margin:8px auto}@keyframes outLeft{to{left:-155px;opacity:.4}}.belt:before{content:'포장 완료 ← 　　　　　　　　　 포장 원료';position:absolute;top:-28px;left:16px;right:16px;font:15px Jua;color:#604a67;letter-spacing:1px}.gift{display:none}.pack-box{background:linear-gradient(90deg,#dff8ffcc,#fff);border-radius:18px 18px 50px 50px;border:6px solid #5b8296;box-shadow:inset 0 0 0 9px #ffffffaa,8px 8px 0 #8d6d88;min-height:170px;position:relative;padding:36px 25px 22px}.pack-box:before{content:'유리병에 담긴 완성 사탕';position:absolute;top:8px;left:0;right:0;color:#42687d;font:20px 'Black Han Sans'}.pack-box:after{content:'';position:absolute;top:-18px;left:12%;right:12%;height:24px;border:6px solid #5b8296;border-radius:12px;background:repeating-linear-gradient(135deg,#ffe060 0 8px,#f3a83d 8px 16px)}.mini{width:31px;height:18px;background:#fff;animation:drop .25s ease-out both}.mini:nth-child(3n){background:#e5f7ff}.mini:nth-child(4n){background:#ffe4ef}@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>`);
const baseFinish=finish;function sendOut(bad=false){let unit=document.createElement('div');unit.className='packed-run'+(bad?' bad':'');unit.innerHTML='<i></i>';stage.append(unit);setTimeout(()=>unit.remove(),1100)}
tick=function(){if(!running)return;let now=music.currentTime,target=chart[index];if(target){let lead=target-now,progress=Math.max(0,Math.min(1,(1.2-lead)/1.2));candy.style.left=(stage.clientWidth+50-progress*(stage.clientWidth*.5+77))+'px';candy.classList.toggle('active',lead<1.2&&lead>-.28);prompt.textContent=lead<.34&&lead>-.25?'지금 프레스!':'오른쪽에서 포장 원료가 옵니다…'}while(index<chart.length&&now-chart[index]>.22){miss++;wrapped.push('bad');sendOut(true);comboN=0;show('MISS','miss');index++;update()}if(index>=chart.length&&now>chart[chart.length-1]+.7)finish()};
hit=function(){if(!running||index>=chart.length)return;let d=Math.abs(music.currentTime-chart[index]);if(d>.28)return;stamp.classList.add('hit');setTimeout(()=>stamp.classList.remove('hit'),70);if(d<=.075){perfect++;wrapped.push('good');score+=1000;comboN++;show('PERFECT!','perfect')}else{good++;wrapped.push('good');score+=550;comboN++;show('GOOD','good')}sendOut(false);index++;update()};
finish=function(){baseFinish();let jar=document.querySelector('.pack-box');if(jar)jar.setAttribute('aria-label','완성된 사탕이 든 유리병')};
// 좌 → 우로 같은 속도로 진행: 성공하면 포장된 사탕, 실패하면 맨사탕이 그대로 통과한다.
document.head.insertAdjacentHTML('beforeend',`<style>
.belt:before{content:'포장 원료  →　　　　　　　　　 →  포장 완료';text-align:center}.packed-run{left:calc(50% - 66px);animation:outRight 1.15s linear forwards}.packed-run.bad{background:transparent;border:none;box-shadow:none;width:54px;height:54px;left:calc(50% - 27px)}.packed-run.bad:before,.packed-run.bad:after{display:none}.packed-run.bad i{width:54px;height:54px;margin:0;background:radial-gradient(circle at 35% 30%,#fff7b6 0 13%,#ffc951 15% 63%,#ee8d3f 65%)}@keyframes outRight{to{left:calc(100% + 85px);opacity:.5}}.result .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px auto;max-width:430px}.summary div{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:10px 4px;font:18px Jua;box-shadow:3px 3px 0 #9e7b99}.summary b{display:block;font:30px 'Black Han Sans'}.summary .p b{color:#ff3570}.summary .g b{color:#22a57e}.summary .m b{color:#68707e}.result .small{font-size:18px}
</style>`);
sendOut=function(bad=false){let unit=document.createElement('div');unit.className='packed-run'+(bad?' bad':'');unit.innerHTML='<i></i>';stage.append(unit);setTimeout(()=>unit.remove(),1200)};
tick=function(){if(!running)return;let now=music.currentTime,target=chart[index];if(target){let lead=target-now,progress=Math.max(0,Math.min(1,(1.2-lead)/2.4));candy.style.left=(-70+progress*(stage.clientWidth+140))+'px';candy.classList.toggle('active',lead<1.2&&lead>-.3);prompt.textContent=lead<.30&&lead>-.25?'지금 프레스!':'사탕이 일정한 속도로 지나갑니다…'}while(index<chart.length&&now-chart[index]>.22){miss++;wrapped.push('bad');sendOut(true);comboN=0;show('MISS','miss');index++;update()}if(index>=chart.length&&now>chart[chart.length-1]+.7)finish()};
hit=function(){if(!running||index>=chart.length)return;let d=Math.abs(music.currentTime-chart[index]);if(d>.28)return;stamp.classList.add('hit');setTimeout(()=>stamp.classList.remove('hit'),70);if(d<=.075){perfect++;wrapped.push('good');score+=1000;comboN++;show('PERFECT!','perfect')}else{good++;wrapped.push('good');score+=550;comboN++;show('GOOD','good')}sendOut(false);candy.classList.remove('active');index++;update()};
const resultFinish=finish;finish=function(){resultFinish();document.querySelectorAll('.pack-box').forEach(x=>x.remove());let old=document.querySelector('.summary');if(old)old.remove();let summary=document.createElement('div');summary.className='summary';summary.innerHTML=`<div class="p">PERFECT<b>${perfect}</b></div><div class="g">GOOD<b>${good}</b></div><div class="m">MISS<b>${miss}</b></div>`;document.querySelector('#price').before(summary);document.querySelector('#breakdown').textContent=`총 ${chart.length}개 사탕 · ${score}점`};
// 프레스 헤드의 실제 중심(화면 중앙보다 약 6px 왼쪽)에 판정점을 정렬한다.
document.head.insertAdjacentHTML('beforeend',`<style>.packed-run{left:calc(50% - 72px)}.packed-run.bad{left:calc(50% - 33px)}</style>`);
tick=function(){if(!running)return;let now=music.currentTime,target=chart[index];if(target){let lead=target-now,progress=Math.max(0,Math.min(1,(1.2-lead)/2.4));candy.style.left=(-70+progress*(stage.clientWidth+74))+'px';candy.classList.toggle('active',lead<1.2&&lead>-.3);prompt.textContent=lead<.30&&lead>-.25?'지금 프레스!':'사탕이 일정한 속도로 지나갑니다…'}while(index<chart.length&&now-chart[index]>.22){miss++;wrapped.push('bad');sendOut(true);comboN=0;show('MISS','miss');index++;update()}if(index>=chart.length&&now>chart[chart.length-1]+.7)finish()};
// 동일한 스프라이트 시트에서 원형사탕·지팡이사탕·하트초콜릿을 번갈아 사용한다.
document.head.insertAdjacentHTML('beforeend',`<style>
.candy,.packed-run{background-image:url('assets/halloween-candy-sprite-sheet.png');background-size:307px 205px;background-repeat:no-repeat}.candy{width:62px;height:66px;border:0;box-shadow:none;border-radius:0}.candy:before,.candy:after,.candy .jelly{display:none}.candy.round{background-position:-49px -149px}.candy.cane{width:43px;height:72px;background-position:-105px -147px}.candy.heart{width:70px;height:66px;background-position:-137px -149px}.packed-run:not(.bad){width:132px;height:60px;border:0;box-shadow:none;border-radius:0;background-position:-164px -147px}.packed-run:not(.bad):before,.packed-run:not(.bad):after,.packed-run:not(.bad) i{display:none}.packed-run.bad{border:0;box-shadow:none;border-radius:0}.packed-run.bad:before,.packed-run.bad:after,.packed-run.bad i{display:none}.packed-run.bad.round{width:62px;height:66px;background-position:-49px -149px}.packed-run.bad.cane{width:43px;height:72px;background-position:-105px -147px}.packed-run.bad.heart{width:70px;height:66px;background-position:-137px -149px}
</style>`);
const spriteTypes=['round','cane','heart'];const spriteType=i=>spriteTypes[i%spriteTypes.length];
sendOut=function(type,bad=false){let unit=document.createElement('div');unit.className='packed-run '+type+(bad?' bad':'');unit.innerHTML='<i></i>';stage.append(unit);setTimeout(()=>unit.remove(),1200)};
tick=function(){if(!running)return;let now=music.currentTime,target=chart[index];if(target){let type=spriteType(index),lead=target-now,progress=Math.max(0,Math.min(1,(1.2-lead)/2.4));candy.className='candy '+type;candy.style.left=(-70+progress*(stage.clientWidth+74))+'px';candy.classList.toggle('active',lead<1.2&&lead>-.3);prompt.textContent=lead<.30&&lead>-.25?'지금 프레스!':'사탕이 일정한 속도로 지나갑니다…'}while(index<chart.length&&now-chart[index]>.22){let type=spriteType(index);miss++;wrapped.push('bad');sendOut(type,true);comboN=0;show('MISS','miss');index++;update()}if(index>=chart.length&&now>chart[chart.length-1]+.7)finish()};
hit=function(){if(!running||index>=chart.length)return;let d=Math.abs(music.currentTime-chart[index]);if(d>.28)return;let type=spriteType(index);stamp.classList.add('hit');setTimeout(()=>stamp.classList.remove('hit'),70);if(d<=.075){perfect++;wrapped.push('good');score+=1000;comboN++;show('PERFECT!','perfect')}else{good++;wrapped.push('good');score+=550;comboN++;show('GOOD','good')}sendOut(type,false);candy.classList.remove('active');index++;update()};
